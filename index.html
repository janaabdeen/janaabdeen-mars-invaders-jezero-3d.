<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jezero Crater 3D</title>
<style>
html,body,#cesium{margin:0;height:100%;width:100%;overflow:hidden;background:#000;font-family:sans-serif}
#ui{position:absolute;top:10px;left:10px;z-index:5;background:#000b;color:#fff;padding:10px 12px;border-radius:8px;font-size:13px}
#ui label{display:block;margin:4px 0;cursor:pointer}
#ui input[type=range]{width:140px}
#ui button{background:#333;color:#fff;border:1px solid #666;border-radius:4px;padding:3px 10px;margin-right:4px;cursor:pointer;font-size:14px}
#ui button:hover{background:#555}
#route{position:absolute;right:10px;bottom:10px;z-index:6;background:#000d;color:#fff;padding:10px 12px;border-radius:8px;font-size:12px;width:310px;max-height:48vh;overflow:auto;display:none}
#route table{border-collapse:collapse;margin:4px 0 8px}
#route td{padding:1px 8px 1px 0;vertical-align:top}
#route .leg{opacity:.85;line-height:1.5;margin:2px 0 8px}
#route .warn{color:#fd0}
#route button{float:right;background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
#info{position:absolute;top:10px;right:10px;z-index:6;background:#000d;color:#fff;padding:10px 12px;border-radius:8px;font-size:13px;max-width:320px;display:none}
#info table{margin-top:6px;border-collapse:collapse}
#info td{padding:2px 8px 2px 0;vertical-align:top}
#info td:first-child{opacity:.7;white-space:nowrap}
#info button{float:right;background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
#ui small{display:block;margin-top:6px;opacity:.7;line-height:1.4}
</style></head><body>
<div id="cesium"></div>
<div id="info"></div>
<div id="route"></div>
<div id="ui">
  <b>Jezero Crater</b>
  <label><input type="checkbox" id="ortho" checked> Orthomosaic</label>
  <label><input type="checkbox" id="hazard"> Slope hazard</label>
  <label><input type="checkbox" id="minerals" checked> CRISM minerals</label>
  <label><input type="checkbox" id="bounds" checked> Boundaries</label>
  <label><input type="checkbox" id="pois" checked> Points of interest</label>
  <label><input type="checkbox" id="routeShow" checked> 2 km astronaut route</label>
  <label><input type="checkbox" id="mars" checked> Mars colour</label>
  <label>Vertical exaggeration <input type="range" id="ve" min="1" max="10" step="0.5" value="2"></label>
  <div style="margin-top:6px"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="reset">Reset view</button><button id="flyRoute">Fly to route</button></div>
  <div style="margin-top:6px"><button id="sv" title="Stand on the ground at the last clicked point">Surface view</button><button id="ov">Orbit view</button></div>
  <small>Click anything for info<br>Left-drag: move &middot; Right-drag / wheel: zoom<br>Middle-drag (or Ctrl+drag): tilt &amp; rotate</small>
</div>
<script type="module" src="/src/main.js"></script>
</body></html>
